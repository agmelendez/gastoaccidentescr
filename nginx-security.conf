# ============================================
# Configuración de Seguridad Nginx
# Proyecto: Accidentes de Tránsito Costa Rica
# Universidad de Costa Rica
# ============================================
#
# INSTRUCCIONES:
# Incluir este archivo en tu configuración de Nginx:
# include /path/to/nginx-security.conf;
# ============================================

# Bloque de servidor principal
server {
    listen 80;
    listen [::]:80;

    # IMPORTANTE: Cambiar por tu dominio
    server_name tu-dominio.com www.tu-dominio.com;

    # Redirigir todo a HTTPS (descomentar en producción)
    # return 301 https://$server_name$request_uri;
}

# Configuración HTTPS
server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    # IMPORTANTE: Cambiar por tu dominio
    server_name tu-dominio.com www.tu-dominio.com;

    # Directorio raíz del proyecto
    root /var/www/html/gastoaccidentes;
    index index.html;

    # Charset
    charset UTF-8;

    # ============================================
    # Configuración SSL/TLS (descomentar en producción)
    # ============================================

    # Certificados SSL
    # ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Protocolos SSL seguros
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Cifrados seguros
    # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    # ssl_prefer_server_ciphers off;

    # SSL Session
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_tickets off;

    # OCSP Stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/tu-dominio.com/chain.pem;

    # ============================================
    # Headers de Seguridad HTTP
    # ============================================

    # Prevenir clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevenir MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Habilitar protección XSS del navegador
    add_header X-XSS-Protection "1; mode=block" always;

    # Política de referencia
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # HSTS (descomentar solo si usas HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Eliminar información del servidor
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # ============================================
    # Configuración de Logs
    # ============================================

    access_log /var/log/nginx/gastoaccidentes-access.log;
    error_log /var/log/nginx/gastoaccidentes-error.log warn;

    # ============================================
    # Compresión Gzip
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ============================================
    # Protección de Archivos Sensibles
    # ============================================

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos de backup y temporales
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos de configuración
    location ~* \.(bak|config|dist|fla|inc|ini|log|psd|sh|sql|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos R y datos sensibles
    location ~* \.(Rmd|RData|rdata|rds|RDS)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a directorios Git
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # Ubicaciones y Rutas
    # ============================================

    # Página principal
    location / {
        try_files $uri $uri/ =404;

        # Cache de navegador para HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache para archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Documentos (PDFs, CSV, Excel, Word)
    location ~* \.(pdf|csv|xlsx|xls|docx|doc)$ {
        expires 30d;
        add_header Cache-Control "public";

        # Forzar descarga de CSV (opcional)
        # add_header Content-Disposition "attachment";
    }

    # Robots.txt y archivos de seguridad
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /security.txt {
        allow all;
        log_not_found off;
    }

    location = /.well-known/security.txt {
        allow all;
        log_not_found off;
    }

    # ============================================
    # Límites de Tamaño y Timeouts
    # ============================================

    # Tamaño máximo de body
    client_max_body_size 10M;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Buffers
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ============================================
    # Rate Limiting (Protección básica DoS)
    # ============================================

    # Definir zona de rate limiting (agregar fuera del bloque server)
    # limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    # Aplicar rate limiting
    # location / {
    #     limit_req zone=general burst=20 nodelay;
    # }

    # location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
    #     limit_req zone=static burst=100 nodelay;
    # }

    # ============================================
    # Prevención de Ataques Comunes
    # ============================================

    # Bloquear user agents maliciosos
    if ($http_user_agent ~* (nmap|nikto|wikto|sf|sqlmap|bsqlbf|w3af|acunetix|havij|appscan)) {
        return 403;
    }

    # Bloquear métodos HTTP no permitidos
    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 405;
    }

    # Protección contra SQL injection en query strings
    set $sql_injection 0;
    if ($query_string ~* "union.*select.*\(") {
        set $sql_injection 1;
    }
    if ($query_string ~* "union.*all.*select.*") {
        set $sql_injection 1;
    }
    if ($query_string ~* "concat.*\(") {
        set $sql_injection 1;
    }
    if ($sql_injection = 1) {
        return 403;
    }

    # ============================================
    # Páginas de Error Personalizadas
    # ============================================

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /403.html {
        internal;
    }

    location = /404.html {
        internal;
    }

    location = /50x.html {
        internal;
    }
}

# ============================================
# Rate Limiting Zones (agregar FUERA del bloque server)
# ============================================
# Descomentar y agregar al inicio del archivo nginx.conf o en http block

# Rate limiting general
# limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Rate limiting para archivos estáticos
# limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

# Connection limiting
# limit_conn_zone $binary_remote_addr zone=addr:10m;

